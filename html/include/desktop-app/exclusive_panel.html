<div class="desktop-app-exclusive desktop-app-exclusive-panel {{variant}}">
    <div class="desktop-app-exclusive-card">
        <div class="desktop-app-exclusive-image">
            <img src="{{image_url}}" alt="MOD Dwarf" />
        </div>
        <div class="desktop-app-exclusive-text">
            <span class="desktop-app-exclusive-eyebrow">Exclusive to MOD Audio devices</span>
            <h2>{{feature}}</h2>
            <p>{{message}}</p>
            <a class="desktop-app-exclusive-cta" href="{{store_url}}" target="_blank" rel="noopener noreferrer">{{cta}}</a>
        </div>
    </div>
</div>
